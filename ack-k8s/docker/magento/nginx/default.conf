# nginx 和 php-fpm 在同一个 Pod 里，共享网络，所以用 127.0.0.1:9000
upstream fastcgi_backend {
    server 127.0.0.1:9000;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 64m;

    # ALB 会带上 X-Forwarded-For；要记录真实客户端 IP，把下面换成集群 VPC 的网段后取消注释
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;

    set $MAGE_ROOT /var/www/html;
    include /etc/nginx/magento.conf;   # Magento 自带的 nginx.conf.sample
}
