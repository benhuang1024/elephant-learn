apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magento
spec:
  ingressClassName: alb
  rules:
    - host: magento.example.test      # 要和 config.yaml 里的 BASE_URL 一致
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: magento
                port:
                  number: 80
