services:
  postgres:
    image: postgres:17-alpine
    container_name: shop-api-postgres
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - shop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: shop-api
    environment:
      DB_URL: postgresql+psycopg://shop:shop@postgres:5432/shop
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn shop.main:app --host 0.0.0.0 --port 8000"]

volumes:
  shop-pgdata:
