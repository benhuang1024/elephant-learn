[project]
name = "basics"
version = "0.1.0"
description = "写给 PHP 架构师的 Python 语言可执行笔记"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "mypy>=1.18",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
warn_unreachable = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文文档/注释里的全角标点是刻意的
ignore = ["RUF001", "RUF002", "RUF003"]
