[project]
name = "django-shop"
version = "1.0.0"
description = "精简 Django + DRF 商品 CRUD：与 FastAPI 版对照"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Django 的 Meta / ModelSerializer 约定就是类属性 dict/list，不适合加 ClassVar
"catalog/models.py" = ["RUF012"]
"catalog/serializers.py" = ["RUF012"]
# autogenerated：保留 Django 生成格式
"catalog/migrations/*" = ["E501", "RUF012"]
